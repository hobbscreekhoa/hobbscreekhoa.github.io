<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The entrance sign, simplified for a browser tab: a gentle arch and short
       capless pillars (a tall dome over capped pillars reads as a mosque at 16px),
       and lines standing in for THE / HOMESTEAD / ON / HOBBS CREEK. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F7F2E6"/></linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2EBDC"/><stop offset="55%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EDE5D2"/></linearGradient>
  </defs>
  <g stroke="#B9A67C" stroke-width="2.5" stroke-linejoin="round">
    <rect x="3" y="26" width="10" height="23" fill="url(#pillar)"/>
    <rect x="51" y="26" width="10" height="23" fill="url(#pillar)"/>
    <path d="M12,49 L12,22 Q32,12 52,22 L52,49 Z" fill="url(#stone)"/>
    <rect x="1.5" y="48" width="61" height="10" rx="1.5" fill="#F8F3E8"/>
  </g>
  <g stroke="#1E3A2F" stroke-linecap="round">
    <path d="M28,25 H36" stroke-width="2.1"/><path d="M15.5,31.5 H48.5" stroke-width="3.3"/>
    <path d="M29,37.5 H35" stroke-width="2.1"/><path d="M16,43.5 H48" stroke-width="3.3"/>
  </g>
</svg>
